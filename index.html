<script>
    function toggleSide() { document.getElementById('sidebar').classList.toggle('active'); }

    // FUNGSI FORMAT ANGKA (MENGGUNAKAN KOMA)
    function formatAngka(num) {
        // Menggunakan 'en-US' agar pemisah ribuan menjadi KOMA
        return "Rp " + new Intl.NumberFormat('en-US').format(num);
    }

    // HITUNG OTOMATIS
    function calculate() {
        let totalIn = 0;
        let totalOut = 0;

        // Hitung Masuk
        document.querySelectorAll('.in-val').forEach(input => {
            totalIn += Number(input.value) || 0;
        });

        // Hitung Keluar
        document.querySelectorAll('.out-val').forEach(input => {
            totalOut += Number(input.value) || 0;
        });

        let saldo = totalIn - totalOut;

        // Tampilkan hasil dengan format KOMA
        document.getElementById('display-total-masuk').innerText = formatAngka(totalIn);
        document.getElementById('display-total-keluar').innerText = formatAngka(totalOut);
        document.getElementById('display-saldo').innerText = formatAngka(saldo);
    }

    // SIMPAN DATA KE BROWSER
    function saveData() {
        const inputs = document.querySelectorAll('.save');
        inputs.forEach(input => {
            localStorage.setItem('gery_data_' + input.id, input.value);
        });
        alert("✅ Data Berhasil Disimpan!");
    }

    // LOAD DATA SAAT HALAMAN DIBUKA
    window.onload = function() {
        const inputs = document.querySelectorAll('.save');
        inputs.forEach(input => {
            const saved = localStorage.getItem('gery_data_' + input.id);
            if (saved) input.value = saved;
        });
        calculate(); // Jalankan hitungan otomatis setelah data muncul
    };
</script>
