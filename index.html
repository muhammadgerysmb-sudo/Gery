<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gery Finance Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/dist/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #000; color: white; }
        .card { background: #111; border: 1px solid #333; border-radius: 12px; }
        
        /* CSS UNTUK KESEJAJARAN SEMPURNA */
        input { 
            background: transparent; 
            border: none; 
            color: white; 
            width: 100%; 
            outline: none; 
            padding: 0 5px; 
            height: 45px;      /* Tinggi input disamakan dengan tinggi baris td */
            line-height: 45px; /* Memastikan teks berada tepat di tengah vertikal */
            display: block;
        }
        
        input:focus { background: rgba(34, 197, 94, 0.05); border-radius: 4px; }
        
        th { background: #1a1a1a; color: #666; font-size: 11px; text-transform: uppercase; padding: 12px; border-bottom: 2px solid #333; text-align: left; }
        .text-right-header { text-align: right; }
        
        td { 
            border-bottom: 1px solid #222; 
            padding: 0 10px; 
            height: 45px;      /* Kunci tinggi kolom */
            vertical-align: middle; 
        }

        .col-no { width: 5%; text-align: center; color: #555; font-weight: bold; font-size: 13px; }
    </style>
</head>
<body>

<div class="flex min-h-screen">
    <aside class="w-64 bg-zinc-900 border-r border-zinc-800 flex flex-col">
        <div class="p-6 text-xl font-bold text-green-500 border-b border-zinc-800 italic">DTracker</div>
        <nav class="p-4 space-y-4">
            <button onclick="saveData()" class="w-full bg-blue-600 hover:bg-blue-700 p-3 rounded-xl font-bold flex items-center justify-center transition-all">
                <i class="fas fa-save mr-2"></i> SIMPAN DATA
            </button>
            <p class="text-zinc-500 text-[10px] font-bold px-2 uppercase">Halaman</p>
            <div class="p-3 rounded-lg bg-green-600/10 text-green-500 font-bold border border-green-600/20 text-center text-xs">MEI 2026</div>
        </nav>
    </aside>

    <main class="flex-1 p-8 space-y-8">
        <div class="grid grid-cols-3 gap-4">
            <div class="card p-6 border-l-4 border-l-green-500">
                <p class="text-zinc-500 text-xs font-bold uppercase">Total Pemasukan</p>
                <h3 id="display-total-masuk" class="text-2xl font-black text-green-500">Rp 0</h3>
            </div>
            <div class="card p-6 border-l-4 border-l-red-500">
                <p class="text-zinc-500 text-xs font-bold uppercase">Total Pengeluaran</p>
                <h3 id="display-total-keluar" class="text-2xl font-black text-red-500">Rp 0</h3>
            </div>
            <div class="card p-6 border-l-4 border-l-blue-500">
                <p class="text-zinc-500 text-xs font-bold uppercase">Sisa Saldo</p>
                <h3 id="display-saldo" class="text-2xl font-black text-blue-500">Rp 0</h3>
            </div>
        </div>

        <div class="space-y-3">
            <h2 class="text-green-500 font-bold uppercase text-sm tracking-widest">Dana Masuk (IN)</h2>
            <div class="card overflow-hidden">
                <table class="w-full border-collapse">
                    <thead>
                        <tr>
                            <th class="text-center">NO</th>
                            <th width="25%">TANGGAL</th>
                            <th width="40%">KETERANGAN</th>
                            <th class="text-right-header">NOMINAL (RP)</th>
                        </tr>
                    </thead>
                    <tbody>
                        <script>
                            for(let i=1; i<=7; i++) {
                                document.write(`
                                <tr>
                                    <td class="col-no">${i}</td>
                                    <td><input type="text" class="save" id="it${i}" placeholder="-"></td>
                                    <td><input type="text" class="save" id="ik${i}" placeholder="-"></td>
                                    <td><input type="text" class="save text-right font-bold text-green-500 in-val" id="in${i}" oninput="formatInput(this)" placeholder="0"></td>
                                </tr>`);
                            }
                        </script>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="space-y-3">
            <h2 class="text-red-500 font-bold uppercase text-sm tracking-widest">Pengeluaran (OUT)</h2>
            <div class="card overflow-hidden">
                <table class="w-full border-collapse">
                    <thead>
                        <tr>
                            <th class="text-center">NO</th>
                            <th width="25%">TANGGAL</th>
                            <th width="40%">KETERANGAN</th>
                            <th class="text-right-header">NOMINAL (RP)</th>
                        </tr>
                    </thead>
                    <tbody>
                        <script>
                            for(let i=1; i<=7; i++) {
                                document.write(`
                                <tr>
                                    <td class="col-no">${i}</td>
                                    <td><input type="text" class="save" id="ot${i}" placeholder="-"></td>
                                    <td><input type="text" class="save" id="ok${i}" placeholder="-"></td>
                                    <td><input type="text" class="save text-right font-bold text-red-500 out-val" id="on${i}" oninput="formatInput(this)" placeholder="0"></td>
                                </tr>`);
                            }
                        </script>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<script>
    function formatInput(el) {
        let val = el.value.replace(/[^0-9]/g, '');
        if (val !== "") {
            el.value = new Intl.NumberFormat('en-US').format(val);
        } else {
            el.value = "";
        }
        calculate();
    }

    function toNum(str) {
        return Number(str.replace(/,/g, '')) || 0;
    }

    function formatDisplay(num) {
        return "Rp " + new Intl.NumberFormat('en-US').format(num);
    }

    function calculate() {
        let totalIn = 0;
        let totalOut = 0;

        document.querySelectorAll('.in-val').forEach(input => {
            totalIn += toNum(input.value);
        });

        document.querySelectorAll('.out-val').forEach(input => {
            totalOut += toNum(input.value);
        });

        document.getElementById('display-total-masuk').innerText = formatDisplay(totalIn);
        document.getElementById('display-total-keluar').innerText = formatDisplay(totalOut);
        document.getElementById('display-saldo').innerText = formatDisplay(totalIn - totalOut);
    }

    function saveData() {
        document.querySelectorAll('.save').forEach(input => {
            localStorage.setItem('gery_finance_v4_' + input.id, input.value);
        });
        alert("✅ Berhasil! Data sudah rapi, sejajar, dan tersimpan.");
    }

    window.onload = function() {
        document.querySelectorAll('.save').forEach(input => {
            const saved = localStorage.getItem('gery_finance_v4_' + input.id);
            if (saved) input.value = saved;
        });
        calculate();
    };
</script>
</body>
</html>
