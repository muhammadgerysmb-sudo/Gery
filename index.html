<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gery Bank Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/dist/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #080808; 
            color: #e2e8f0; 
        }

        .bank-card { 
            background: linear-gradient(145deg, #121212, #1a1a1a); 
            border: 1px solid #2d2d2d; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* KUNCI KESEJAJARAN TOTAL */
        table { border-collapse: separate; border-spacing: 0; width: 100%; }
        
        th { 
            background: #111; 
            color: #64748b; 
            font-size: 11px; 
            font-weight: 800;
            text-transform: uppercase; 
            letter-spacing: 1px;
            padding: 16px 12px; 
            border-bottom: 2px solid #222;
        }

        td { 
            border-bottom: 1px solid #1a1a1a; 
            height: 55px; /* Tinggi baris tetap */
            padding: 0 12px; 
            vertical-align: middle; 
        }

        /* Input yang sejajar lurus dengan teks nomor */
        input { 
            background: transparent; 
            border: none; 
            color: #fff; 
            width: 100%; 
            height: 100%; 
            outline: none; 
            font-size: 14px;
            display: flex;
            align-items: center; /* Sejajar tengah vertikal */
        }

        input::placeholder { color: #334155; }
        input:focus { color: #10b981; }

        .no-col { 
            width: 40px; 
            text-align: center; 
            color: #475569; 
            font-weight: 600; 
            font-size: 13px;
        }

        /* Animasi Simpan */
        .btn-save {
            background: linear-gradient(to right, #2563eb, #3b82f6);
            transition: all 0.3s ease;
        }
        .btn-save:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(37,99,235,0.4); }
    </style>
</head>
<body class="flex min-h-screen">

    <aside class="w-72 bg-[#0d0d0d] border-r border-zinc-800 flex flex-col p-6">
        <div class="mb-10">
            <h1 class="text-2xl font-extrabold tracking-tighter text-white">GERY<span class="text-blue-500">BANK</span></h1>
            <p class="text-[10px] text-zinc-500 font-bold uppercase tracking-widest">Financial Management v4.0</p>
        </div>
        
        <nav class="space-y-2 flex-1">
            <div class="p-4 rounded-xl bg-blue-600/10 border border-blue-600/20 mb-6">
                <p class="text-zinc-500 text-[10px] font-bold uppercase">Periode Aktif</p>
                <p class="text-white font-bold italic">MEI 2026</p>
            </div>

            <button onclick="saveData()" class="w-full btn-save text-white p-4 rounded-2xl font-bold flex items-center justify-center gap-3">
                <i class="fas fa-fingerprint text-xl"></i> KONFIRMASI DATA
            </button>
        </nav>

        <div class="pt-6 border-t border-zinc-800">
            <button class="text-zinc-500 hover:text-red-500 flex items-center gap-3 font-bold text-sm transition-all">
                <i class="fas fa-sign-out-alt"></i> KELUAR
            </button>
        </div>
    </aside>

    <main class="flex-1 p-10 space-y-10 overflow-y-auto">
        
        <div class="grid grid-cols-3 gap-6">
            <div class="bank-card p-6 relative overflow-hidden group">
                <div class="absolute top-0 right-0 p-4 opacity-10 group-hover:opacity-20 transition-all">
                    <i class="fas fa-arrow-down text-6xl text-green-500"></i>
                </div>
                <p class="text-zinc-500 text-xs font-bold uppercase mb-1">Total Pemasukan</p>
                <h3 id="display-total-masuk" class="text-3xl font-extrabold text-green-500">Rp 0</h3>
            </div>
            <div class="bank-card p-6 relative overflow-hidden group">
                <div class="absolute top-0 right-0 p-4 opacity-10 group-hover:opacity-20 transition-all">
                    <i class="fas fa-arrow-up text-6xl text-red-500"></i>
                </div>
                <p class="text-zinc-500 text-xs font-bold uppercase mb-1">Total Pengeluaran</p>
                <h3 id="display-total-keluar" class="text-3xl font-extrabold text-red-500">Rp 0</h3>
            </div>
            <div class="bank-card p-6 bg-gradient-to-br from-blue-900/20 to-transparent border-blue-500/30">
                <p class="text-blue-400 text-xs font-bold uppercase mb-1">Sisa Saldo Efektif</p>
                <h3 id="display-saldo" class="text-3xl font-extrabold text-white">Rp 0</h3>
            </div>
        </div>

        <div class="space-y-4">
            <div class="flex items-center justify-between">
                <h2 class="text-lg font-bold flex items-center gap-2">
                    <span class="w-2 h-6 bg-green-500 rounded-full"></span> 
                    MUTASI KREDIT (IN)
                </h2>
            </div>
            <div class="bank-card overflow-hidden">
                <table>
                    <thead>
                        <tr>
                            <th class="text-center">#</th>
                            <th width="20%">TANGGAL</th>
                            <th width="45%">KETERANGAN TRANSAKSI</th>
                            <th class="text-right pr-6">NOMINAL (IDR)</th>
                        </tr>
                    </thead>
                    <tbody>
                        <script>
                            for(let i=1; i<=7; i++) {
                                document.write(`
                                <tr>
                                    <td class="no-col">${i}</td>
                                    <td><input type="text" class="save" id="it${i}" placeholder="HH/BB/TT"></td>
                                    <td><input type="text" class="save" id="ik${i}" placeholder="Nama transaksi..."></td>
                                    <td class="pr-4"><input type="text" class="save text-right font-extrabold text-green-500 in-val" id="in${i}" oninput="formatInput(this)" placeholder="0"></td>
                                </tr>`);
                            }
                        </script>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="space-y-4 pb-10">
            <div class="flex items-center justify-between">
                <h2 class="text-lg font-bold flex items-center gap-2">
                    <span class="w-2 h-6 bg-red-500 rounded-full"></span> 
                    MUTASI DEBET (OUT)
                </h2>
            </div>
            <div class="bank-card overflow-hidden">
                <table>
                    <thead>
                        <tr>
                            <th class="text-center">#</th>
                            <th width="20%">TANGGAL</th>
                            <th width="45%">KETERANGAN TRANSAKSI</th>
                            <th class="text-right pr-6">NOMINAL (IDR)</th>
                        </tr>
                    </thead>
                    <tbody>
                        <script>
                            for(let i=1; i<=7; i++) {
                                document.write(`
                                <tr>
                                    <td class="no-col">${i}</td>
                                    <td><input type="text" class="save" id="ot${i}" placeholder="HH/BB/TT"></td>
                                    <td><input type="text" class="save" id="ok${i}" placeholder="Tujuan pengeluaran..."></td>
                                    <td class="pr-4"><input type="text" class="save text-right font-extrabold text-red-400 out-val" id="on${i}" oninput="formatInput(this)" placeholder="0"></td>
                                </tr>`);
                            }
                        </script>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        function formatInput(el) {
            let val = el.value.replace(/[^0-9]/g, '');
            if (val !== "") {
                el.value = new Intl.NumberFormat('id-ID').format(val);
            } else {
                el.value = "";
            }
            calculate();
        }

        function toNum(str) {
            return Number(str.replace(/\./g, '')) || 0;
        }

        function formatDisplay(num) {
            return "Rp " + new Intl.NumberFormat('id-ID').format(num);
        }

        function calculate() {
            let totalIn = 0;
            let totalOut = 0;

            document.querySelectorAll('.in-val').forEach(input => {
                totalIn += toNum(input.value);
            });

            document.querySelectorAll('.out-val').forEach(input => {
                totalOut += toNum(input.value);
            });

            document.getElementById('display-total-masuk').innerText = formatDisplay(totalIn);
            document.getElementById('display-total-keluar').innerText = formatDisplay(totalOut);
            document.getElementById('display-saldo').innerText = formatDisplay(totalIn - totalOut);
        }

        function saveData() {
            document.querySelectorAll('.save').forEach(input => {
                localStorage.setItem('gery_bank_v1_' + input.id, input.value);
            });
            alert("✅ OTENTIKASI BERHASIL\nData mutasi bank telah diperbarui secara aman.");
        }

        window.onload = function() {
            document.querySelectorAll('.save').forEach(input => {
                const saved = localStorage.getItem('gery_bank_v1_' + input.id);
                if (saved) input.value = saved;
            });
            calculate();
        };
    </script>
</body>
</html>
